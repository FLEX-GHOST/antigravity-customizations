name: Continuous Integration & MCP Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-mcp-suite:
    name: Test skills-engine (Pure FastMCP Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python MCP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]" || pip install mcp fastmcp || true

      - name: Ensure README Metrics & Versions are Synchronized
        run: |
          chmod +x scripts/update_readme_metrics.py
          python3 scripts/update_readme_metrics.py

      - name: Run MCP Enterprise Test Suite
        run: |
          python3 tests/test_skills_engine.py
