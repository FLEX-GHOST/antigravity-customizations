name: Continuous Integration & MCP Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-mcp-suite:
    name: Test skills-engine (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MCP Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp[cli]" || pip install mcp fastmcp || true

      - name: Run Enterprise Test Suite
        run: |
          python3 tests/test_skills_engine.py
